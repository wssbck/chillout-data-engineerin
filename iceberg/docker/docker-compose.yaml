services:

  jupyter:
    build: ./jupyter/
    container_name: cde_jupyter
    # run as the host user so files written to the bind mounts are owned by you
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["jupyter", "notebook", "--ip", "0.0.0.0", "--no-browser", "--NotebookApp.token=''", "--NotebookApp.password=''"]
    environment:
      - PYICEBERG_HOME=/_notebooks
      # no passwd entry exists for the host UID, so give Jupyter/Spark a writable home
      - HOME=/tmp
    ports:
      - "8888:8888"
    volumes:
      - type: bind
        source: ../_data
        target: /opt/data
      - type: bind
        source: ../_notebooks
        target: /_notebooks

  seaweedfs:
    build: ./seaweedfs/
    container_name: cde_seaweedfs
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["server", "-s3", "-dir=/opt/data", "-ip=seaweedfs", "-ip.bind=0.0.0.0", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "8333:8333"
      - "8889:8888"
      - "9333:9333"
    volumes:
      - type: bind
        source: ../_data
        target: /opt/data

  lakekeeper:
    build: ./lakekeeper/
    container_name: cde_lakekeeper
    environment:
      - LAKEKEEPER__PG_ENCRYPTION_KEY=postgresql_key
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@postgres:5432/postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@postgres:5432/postgres
      - RUST_LOG=info
    command: [ "serve" ]
    healthcheck:
      test: [ "CMD", "/home/nonroot/lakekeeper", "healthcheck" ]
      interval: 1s
      timeout: 10s
      retries: 3
      start_period: 3s
    depends_on:
      - postgres
      - seaweedfs
    ports:
      - "8181:8181"
  
  postgres:
    build: ./postgresql/
    container_name: cde_postgres
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  trino:
    build: ./trino/
    container_name: cde_trino
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ../_data
        target:  /opt/data/
      - type: bind
        source: ./trino/config
        target: /etc/trino/
